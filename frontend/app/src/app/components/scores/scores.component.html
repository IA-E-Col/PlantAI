<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="fw-bold">Validation of the Annotation Sol</h5>
    <button class="btn btn-success" (click)="addUser()">Add a user</button>
  </div>

  <!-- Filters -->
  <div class="filters d-flex gap-2 p-3">
    <input type="date" 
           [(ngModel)]="selectedDate" 
           (ngModelChange)="onFilterChange()"
           class="form-control" 
           placeholder="JJ-MM-AAAA">
    <select [(ngModel)]="selectedScore" 
            (ngModelChange)="onFilterChange()"
            class="form-select">
      <option value="">All Scores</option>
      <option *ngFor="let s of [1,2,3]" [value]="s">Score {{s}}</option>
    </select>
    <input type="text" 
           [(ngModel)]="searchText" 
           (ngModelChange)="onFilterChange()"
           class="form-control" 
           placeholder="Search by user name">
  </div>

  <!-- Table -->
  <table class="table table-striped">
    <thead>
      <tr>
        <th (click)="sortBy('fullName')" class="sortable">Full Name ⬆⬇</th>
        <th (click)="sortBy('dateSubmission')" class="sortable">Date of Submission ⬆⬇</th>
        <th (click)="sortBy('score')" class="sortable">Score ⬆⬇</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of (filteredUsers$ | async) || [] | paginate: { itemsPerPage: 5, currentPage: p }; trackBy: trackByUserId">
        <td>
          <img [src]="user.avatar" 
               alt="Avatar" 
               class="rounded-circle me-2" 
               width="30"
               onerror="this.src='assets/images/default-avatar.jpg'"> 
          {{ user.fullName }}
        </td>
        <td>{{ user.dateSubmission }}</td>
        <td>
          <span class="badge" 
                [class]="'bg-' + (user.score === 1 ? 'danger' : user.score === 2 ? 'warning' : 'success')">
            Score {{ user.score }}
          </span>
        </td>
        <td>
          <button class="btn btn-outline-danger btn-sm" 
                  (click)="deleteUser(user.id)"
                  title="Delete user">
            <i class="bi bi-trash"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>
  
  <!-- Pagination -->
  <div class="d-flex justify-content-center p-3">
    <pagination-controls (pageChange)="p = $event" 
                         [autoHide]="true" 
                         [previousLabel]="'Previous'"
                         [nextLabel]="'Next'" 
                         [responsive]="true">
    </pagination-controls>
  </div>
</div>
