<div class="col-lg-12 d-flex justify-content-center">
  <div class="custom-card">
    <div class="card-body">
      <div class="project-info">
        <div class="card-header">Corpus Details</div>
        
        <div class="info-row">
          <h5 class="card-title">Corpus Name:</h5>
          <p class="text-muted">{{ collection?.nom || 'N/A' }}</p>
        </div>

        <div class="info-row">
          <h5 class="card-title">Description:</h5>
          <p class="text-muted">{{ collection?.description || 'N/A' }}</p>
        </div>

        <div class="info-row">
          <h5 class="card-title">Creation Date:</h5>
          <p class="text-muted">{{ formatDate(collection?.dateCreation) || '00/00/0000' }}</p>
        </div>

        <div class="info-row">
          <h5 class="card-title">Creator:</h5>
          <p class="text-muted">{{ getCurrentUser() || 'N/A' }}</p>
        </div>

        <div class="info-row">
          <h5 class="card-title">N° of Images:</h5>
          <p class="text-muted">{{ NbSpecimens }} Images</p>
        </div>
      </div>

      <div class="project-image">
        <img [src]="cheminDtl" alt="Project Image" class="img-fluid">
      </div>
    </div>
  </div>
</div>
