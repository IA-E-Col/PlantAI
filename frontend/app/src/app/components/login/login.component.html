<div class="height-90" id="container">
  
  <div class="h-100">
    <div class="d-flex justify-content-center align-items-center h-100">
      
      <!-- Left section: image and slogan -->
      <div class="col-md-6 d-md-block d-none col-12 bg-grad h-100">
        <div class="d-flex h-100 flex-column align-items-center justify-content-center">
          <div class="text-center">
            <h1 class="text-white display-5">Welcome to PlantAI</h1>
          </div>
          <div class="mt-2 text-center">
            <p class="text-light fs-4 font-light">Your solution for managing your herbariums</p>
          </div>
          <img src="assets/plant.svg" class="w-75 h-75 opacity-50" alt="Plant image">
        </div>
      </div>
      
      <!-- Right section: login form or MFA verification -->
      <div class="col-md-6 d-md-flex flex-column justify-content-center align-items-center h-100">
        
        
        <!-- Login form (displayed if MFA is not enabled) -->
        <form
          *ngIf="!showMfaInput"
          [formGroup]="loginFormGroup"
          (ngSubmit)="authenticate()"
          class="form-login p-2 d-flex col-12 col-sm-12 col-md-6"
        >
          <!-- Mobile header -->
          <div class="d-md-none d-flex justify-content-center align-items-center mb-3">
            <div class="rounded-circle bg-green d-inline-block p-2">
              <img src="assets/plant.svg" width="50" height="50" alt="PlantAI Logo">
            </div>
            <p class="fs-4 font-light p-0 mb-0 mt-0 ms-4">
              Welcome to <span class="text-green fs-4 font-light">PlantAI</span>
            </p>
          </div>
          
          <!-- Title -->
          <div class="mb-5">
            <h1 class="underlined text-green">Login</h1>
          </div>
          
          <!-- Email field -->
          <div class="d-flex align-items-start flex-column mb-4 w-100">
            <label for="username">Email</label>
            <input
              name="username"
              id="username"
              type="email"
              placeholder="Email"
              class="form-control w-100"
              formControlName="email"
              [class.is-invalid]="loginFormGroup.get('email')?.invalid && loginFormGroup.get('email')?.touched"
            >
            <div *ngIf="loginFormGroup.get('email')?.invalid && loginFormGroup.get('email')?.touched" class="invalid-feedback">
              <div *ngIf="loginFormGroup.get('email')?.errors?.['required']">Email is required</div>
              <div *ngIf="loginFormGroup.get('email')?.errors?.['email']">Please enter a valid email</div>
            </div>
          </div>
          
          <!-- Password field -->
          <div class="d-flex align-items-start flex-column w-100">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              class="form-control"
              placeholder="Password"
              formControlName="password"
              [class.is-invalid]="loginFormGroup.get('password')?.invalid && loginFormGroup.get('password')?.touched"
            >
            <div *ngIf="loginFormGroup.get('password')?.invalid && loginFormGroup.get('password')?.touched" class="invalid-feedback">
              <div *ngIf="loginFormGroup.get('password')?.errors?.['required']">Password is required</div>
            </div>
          </div>
          
          <!-- Sign-up link -->
          <div class="d-flex justify-content-end">
            <p class="fs-5 font-light text-black">
              No account?
              <span>
                <a class="text-green fs-5 underlined font-light" [routerLink]="['/signup']">
                  Sign up
                </a>
              </span>
            </p>
          </div>
          
          <!-- Login button -->
          <button 
            class="btn btn-green p-2" 
            type="submit"
            [disabled]="(isLoading$ | async) || loginFormGroup.invalid"
          >
            <span *ngIf="isLoading$ | async" class="spinner-border spinner-border-sm me-2"></span>
            {{ (isLoading$ | async) ? 'Logging in...' : 'Login' }}
          </button>
          
          <!-- Error message (if any) -->
          <div *ngIf="error$ | async as error" class="text-danger mt-2" (click)="clearError()">
            {{ error }}
            <small class="d-block">Click to dismiss</small>
          </div>
        </form>
        
        <!-- MFA Form (displayed if MFA is enabled) -->
        <div class="mfa-container p-4" *ngIf="showMfaInput">
          <h2 class="text-green mb-4">Two-Factor Authentication</h2>
          
          <div class="form-group mb-3">
            <label for="validationCode" class="form-label">
              Enter the 6-digit verification code generated by the application
            </label>
            <input
              type="text"
              id="validationCode"
              name="validationCode"
              class="form-control"
              placeholder="000000"
              maxlength="6"
              required
              [(ngModel)]="otpCode"
            >
          </div>
          
          <button
            type="button"
            (click)="verifyCode()"
            class="btn btn-green"
            [disabled]="(isLoading$ | async) || otpCode.length < 6"
          >
            <span *ngIf="isLoading$ | async" class="spinner-border spinner-border-sm me-2"></span>
            {{ (isLoading$ | async) ? 'Verifying...' : 'Verify Code' }}
          </button>

          <!-- Error message for MFA -->
          <div *ngIf="error$ | async as error" class="text-danger mt-2" (click)="clearError()">
            {{ error }}
            <small class="d-block">Click to dismiss</small>
          </div>
        </div>
        
      </div>
    </div>
  </div>
</div>
